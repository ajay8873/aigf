<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AI Girlfriend</title>
    <style>
      html, body, #root {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        box-sizing: border-box;
      }
      .cs-chat-container {
        height: 100% !important;
        max-height: 100dvh !important;
        overflow: hidden !important;
      }
      .cs-message-list {
        flex: 1 1 auto !important;
        min-height: 0 !important;
      }
      .cs-message-input {
        flex-shrink: 0 !important;
        padding-bottom: max(0.4em, env(safe-area-inset-bottom)) !important;
      }
    </style>
    <script>
      // Self-healing script to clean corrupted localStorage keys
      try {
        const keys = ["modelInfo", "config", "live2d_config"];
        keys.forEach(k => {
          const v = localStorage.getItem(k);
          if (v === "undefined" || v === "null") {
            localStorage.removeItem(k);
          } else if (v) {
            try { JSON.parse(v); } catch (err) { localStorage.removeItem(k); }
          }
        });
      } catch (e) {}
    </script>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4a90e2" />
    <script type="module" crossorigin src="./assets/main-nu7uwxNJ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-QEkl09-0.css">
  </head>

  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => {
              console.log('ServiceWorker registered:', reg.scope);
              reg.update();
            },
            (err) => console.error('ServiceWorker registration failed:', err)
          );
        });
      }
    </script>
  </body>
</html>

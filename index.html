<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AI Girlfriend</title>
    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      /* Mobile layout adjustments */
      @media (max-width: 768px) {
        /* Keep character grounded on the floor */
        canvas {
          height: 100% !important;
          width: 100% !important;
        }

        /* Elevate bottom chat controls above Android navigation bar */
        .cs-chat-container {
          padding-bottom: max(20px, env(safe-area-inset-bottom, 20px)) !important;
          box-sizing: border-box !important;
        }

        .cs-message-input {
          margin-bottom: max(12px, env(safe-area-inset-bottom, 12px)) !important;
        }
      }
    </style>
    <script>
      // Self-healing script to clean corrupted localStorage keys
      try {
        const keys = ["modelInfo", "config", "live2d_config", "model_info", "selectedModel"];
        keys.forEach(k => {
          const v = localStorage.getItem(k);
          if (!v || v === "undefined" || v === "null") {
            localStorage.removeItem(k);
          } else {
            try { JSON.parse(v); } catch (err) { localStorage.removeItem(k); }
          }
        });
      } catch (e) {}
    </script>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4a90e2" />
    <script type="module" crossorigin src="./assets/main-nu7uwxNJ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-QEkl09-0.css">
  </head>

  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => {
              console.log('ServiceWorker registered:', reg.scope);
              reg.update();
            },
            (err) => console.error('ServiceWorker registration failed:', err)
          );
        });
      }
    </script>
  </body>
</html>
